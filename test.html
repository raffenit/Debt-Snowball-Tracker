<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Snowball Tracker — Local Test</title>
    <style>
        /* Minimal layout to host the card */
        body {
            margin: 0;
            padding: 2rem;
            background: #1c1c1c;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        #card-host {
            width: 100%;
            max-width: 520px;
            background: #1c1c1c;
            border-radius: 12px;
        }
        .test-banner {
            text-align: center;
            color: #ffa500;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div id="card-host">
        <div class="test-banner">
            ⚠️ Local Test Mode — Data saved to browser localStorage, not Home Assistant
        </div>
        <debt-snowball-card></debt-snowball-card>
    </div>

    <script>
        // ─── Mock Home Assistant API ─────────────────────────────────────────
        const STORAGE_KEY = 'debt-snowball-test-data';

        const mockHass = {
            config: { currency: 'USD' },
            locale: { language: 'en' },
            language: 'en',

            // HA sensor API — no-op in test mode
            callApi: (method, endpoint, payload) => {
                console.log('[Test] HA sensor call:', endpoint, payload);
                return Promise.resolve({ success: true });
            },

            connection: {
                // Redirect Lovelace config API to localStorage
                sendMessagePromise: (msg) => {
                    return new Promise((resolve) => {
                        if (msg.type === 'lovelace/config') {
                            // Load
                            const raw = localStorage.getItem(STORAGE_KEY);
                            const stored = raw ? JSON.parse(raw) : {};
                            resolve(stored);
                        } else if (msg.type === 'lovelace/config/save') {
                            // Save
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(msg.config));
                            resolve({ success: true });
                        } else if (msg.type === 'lovelace/dashboards/list') {
                            resolve([]);
                        } else if (msg.type === 'lovelace/dashboard/create') {
                            resolve({ url_path: msg.url_path });
                        } else {
                            resolve({});
                        }
                    });
                }
            }
        };

        // ─── Wait for card to register, then inject mock HA ───────────────────
        const init = () => {
            const card = document.querySelector('debt-snowball-card');
            if (!card) {
                console.error('Card element not found');
                return;
            }

            // Simulate the Lovelace lifecycle: setConfig → set hass → connectedCallback
            if (card.setConfig) {
                card.setConfig({});
            }

            // Inject mock HA object (triggers _initApp via the set hass setter)
            card.hass = mockHass;

            console.log('[Test] Debt Snowball card initialized with mock HA');
        };

        // Try immediately (if already loaded) or wait for load event
        if (document.readyState === 'complete') {
            setTimeout(init, 100);
        } else {
            window.addEventListener('load', () => setTimeout(init, 100));
        }
    </script>

    <!-- Load the built card bundle -->
    <script src="dist/debt-snowball-card.js"></script>
</body>
</html>
